<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0d1108; font-family: 'Courier New', Courier, monospace; }
    a { color: #c9a86a; } a:hover { color: #e0c48c; }
    .stencil { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; }
    .pip { width: 6px; height: 6px; display: block; background: rgba(216,210,176,.16); }
    .row-l { font-size: 10px; letter-spacing: 2px; color: #8c9668; width: 86px; flex-shrink: 0; }
  </style>
</helmet>

<div style="width: 380px; height: 470px; padding: 20px; box-sizing: border-box; background: #171c0f;">

  <div style="width: 340px; box-sizing: border-box; padding: 0 0 14px;
              background: linear-gradient(180deg, #2b3319 0%, #1e2412 62%, #171c0e 100%);
              border: 1px solid rgba(201,168,106,.45);
              box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
              clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px), calc(100% - 11px) 100%, 0 100%, 0 11px);">

    <!-- header band: stencil name over a rule, like a manual page -->
    <div style="padding: 12px 14px 9px; border-bottom: 1px solid rgba(201,168,106,.28);
                background: linear-gradient(180deg, rgba(201,168,106,.10), transparent);">
      <div class="stencil" style="font-size: 21px; letter-spacing: 2px; color: #e6dfbe; line-height: 1;">RIFLE SQUAD</div>
      <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 4px;">
        <span style="font-size: 10px; letter-spacing: 2px; color: #8aa06b;">US ARMY &#183; BASIC INFANTRY</span>
        <span style="flex-grow: 1;"></span>
        <span style="font-size: 10px; letter-spacing: 1px; color: #6e7a52;">M16A1</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; padding: 12px 14px 10px;">
      <!-- portrait well: duotone frame, corner ticks instead of a rounded card -->
      <div style="width: 88px; height: 96px; flex-shrink: 0; position: relative;
                  background: linear-gradient(180deg, #232d16, #141a0c); border: 1px solid rgba(201,168,106,.34);">
        <span style="position: absolute; top: 3px; left: 3px; width: 9px; height: 9px; border-top: 1px solid #c9a86a; border-left: 1px solid #c9a86a; display: block;"></span>
        <span style="position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-top: 1px solid #c9a86a; border-right: 1px solid #c9a86a; display: block;"></span>
        <span style="position: absolute; bottom: 3px; left: 3px; width: 9px; height: 9px; border-bottom: 1px solid #c9a86a; border-left: 1px solid #c9a86a; display: block;"></span>
        <span style="position: absolute; bottom: 3px; right: 3px; width: 9px; height: 9px; border-bottom: 1px solid #c9a86a; border-right: 1px solid #c9a86a; display: block;"></span>
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 26px; display: block;
                     background: linear-gradient(180deg, transparent, rgba(10,13,7,.9));"></span>
        <span style="position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 9px; letter-spacing: 2px; color: #8c9668;">5 MEN</span>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px; padding-top: 2px;">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="row-l">{{s.label}}</span>
            <div style="display: flex; gap: 2px;">
              <sc-for list="{{s.pips}}" as="p" hint-placeholder-count="5">
                <span class="pip" style="{{p.style}}"></span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- ability block: set in from the plate edge like a manual sidebar -->
    <div style="margin: 2px 14px 0; padding: 9px 11px; background: rgba(8,11,5,.55);
                border-left: 2px solid #c9a86a;">
      <div class="stencil" style="font-size: 12px; letter-spacing: 3px; color: #c9a86a;">SUPPRESSING FIRE</div>
      <div style="font-size: 11px; line-height: 1.5; color: #b3ad8d; margin-top: 4px; text-wrap: pretty;">
        Pins the target squad for 6s. Cuts their accuracy by half and stops any advance while it holds.
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px 0; margin-top: 10px;
                border-top: 1px solid rgba(201,168,106,.20);">
      <span style="font-size: 10px; letter-spacing: 2px; color: #8c9668;">DEPLOY COST</span>
      <span style="flex-grow: 1;"></span>
      <span class="stencil" style="font-size: 22px; color: #c9a86a; line-height: 1;">3</span>
      <span style="font-size: 10px; letter-spacing: 2px; color: #8c9668;">CP</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const on = 'background: #d8a24e;', tough = 'background: #8fae63;', off = '';
    const mk = (n, total, style) => Array.from({ length: total }, (_, i) => ({ style: i < n ? style : off }));
    return {
      stats: [
        { label: 'RANGE',   pips: mk(3, 6, on) },
        { label: 'FIRE RATE', pips: mk(4, 6, on) },
        { label: 'TOUGHNESS', pips: mk(3, 6, tough) },
        { label: 'ANTI-ARMOUR', pips: mk(1, 6, tough) }
      ]
    };
  }
}
</script>
</body>
</html>
